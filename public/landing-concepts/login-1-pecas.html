<style>
body { min-height: 100vh; }
.split { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(380px, .85fr); }

/* Lado da marca: escuro, o pássaro monta-se e flutua */
.brand { position: relative; overflow: hidden; background: #18181b; color: #f2f2f3; display: flex; flex-direction: column; justify-content: space-between; padding: 36px clamp(24px, 4vw, 56px); }
.brand::before { content: ""; position: absolute; inset: 0; background: radial-gradient(#2c2f36 1.2px, transparent 1.4px) 0 0 / 26px 26px; opacity: .8; }
.brand > * { position: relative; }
.stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 150px; }
.logo3 { position: relative; width: min(80%, 640px); aspect-ratio: 2884 / 1600; }
.logo3 img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; will-change: transform, opacity; pointer-events: none; }
.brand-top { display: flex; justify-content: space-between; align-items: center; z-index: 2; }
.brand-top img { height: 26px; width: auto; }
.brand-bottom { z-index: 2; max-width: 460px; }
.brand-bottom .label { color: var(--accent); }
.brand-bottom h2 { font-family: var(--display); font-size: clamp(26px, 2.6vw, 36px); line-height: 1.1; margin: 8px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chips span { padding: 6px 11px; background: #23262c; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .06em; color: #9095a0; }

/* Lado do formulário */
.panel { background: var(--bg); display: flex; flex-direction: column; justify-content: center; padding: 40px clamp(24px, 5vw, 72px); gap: 26px; }
.panel .lg-form { max-width: 420px; width: 100%; }
.panel-top { max-width: 420px; width: 100%; display: flex; justify-content: space-between; }

@media (max-width: 900px) {
    .split { grid-template-columns: 1fr; }
    .brand { min-height: 46vh; }
}
</style>
</head>
<body>
<main class="split">
    <section class="brand" aria-hidden="true">
        <div class="stage"><div class="logo3" id="logo3"></div></div>
        <div class="brand-top"><img src="/images/brand/logo-tacademy-dark.png" alt=""><span class="label" style="color:#9095a0">PLATAFORMA</span></div>

            <p class="label">Gestão de Talentos</p>
            <h2>Cada sessão é mais uma peça.</h2>
            <div class="chips"><span class="cut-8">DIAGNÓSTICO</span><span class="cut-8">ELETRÓNICA</span><span class="cut-8">CAN BUS</span><span class="cut-8">GESTÃO</span></div>
        </div>
    </section>
    <section class="panel">
        <div class="panel-top"><a class="lg-back" href="a2-navbar.html">← VOLTAR AO SITE</a></div>
        <div id="formSlot" style="max-width:420px;width:100%"></div>
    </section>
</main>

<div class="concept-switch"><a href="index.html">←</a><a class="on" href="login-1-pecas.html">1 · Peças</a><a href="login-2-traco.html">2 · Traço</a><a href="login-3-janela.html">3 · Janela</a></div>

<script src="base.js"></script>
<script src="login.js"></script>
<script>
document.getElementById('formSlot').innerHTML = loginFormHTML();
const { rng, ease, clamp, reduced } = TA;
const logo = document.getElementById('logo3');
const R = rng(20260101);

// Peças: espalhadas à volta, montam-se ao abrir a página; depois flutuam e seguem o rato
const frags = Array.from({ length: 31 }, (_, i) => {
    const img = new Image(); img.src = `/images/logo3d/frag_${String(i).padStart(2, '0')}.png`; img.alt = '';
    logo.appendChild(img);
    return { img, dx: (R() - .5) * 120, dy: (R() - .5) * 110, rot: (R() - .5) * 140, depth: .4 + R() * 1.4, phase: R() * 6.28, delay: i * 28 };
});
const name = Object.assign(new Image(), { src: '/images/logo3d/name.png', alt: '' });
const phrase = Object.assign(new Image(), { src: '/images/logo3d/phrase.png', alt: '' });
logo.append(name, phrase);

let mx = 0, my = 0, tx = 0, ty = 0, flyOut = 0, flyOutTarget = 0;
addEventListener('pointermove', (e) => { tx = e.clientX / innerWidth * 2 - 1; ty = e.clientY / innerHeight * 2 - 1; });
const t0 = performance.now();

function frame(now) {
    const t = now - t0;
    mx += (tx - mx) * .06; my += (ty - my) * .06;
    flyOut += (flyOutTarget - flyOut) * .05;
    frags.forEach((f) => {
        const e = reduced ? 1 : ease(clamp((t - f.delay) / 1100));
        const k = 1 - e;
        const float = reduced ? 0 : Math.sin(now / 900 + f.phase) * 0.18 * f.depth;
        const px = -mx * 0.5 * f.depth, py = -my * 0.5 * f.depth;
        // ao entrar, as peças "levantam voo" para cima e para a direita
        const fx = flyOut * f.dx * -0.3 + flyOut * 40, fy = flyOut * (-60 - f.depth * 30);
        f.img.style.transform = `translate(${f.dx * k + px + fx}%, ${f.dy * k + py + float + fy}%) rotate(${f.rot * k + flyOut * f.rot * .3}deg)`;
        f.img.style.opacity = e * (1 - flyOut);
    });
    const n = reduced ? 1 : ease(clamp((t - 900) / 900));
    name.style.opacity = n * (1 - flyOut); name.style.transform = `translate(${-mx * .4}%, ${(1 - n) * 10 - my * .4}%)`;
    phrase.style.opacity = n * (1 - flyOut); phrase.style.transform = `translate(${-mx * .3}%, ${(1 - n) * 14 - my * .3}%)`;
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

LoginDemo({
    onSuccess: () => { flyOutTarget = 1; },
    onError: () => { // as peças estremecem
        frags.forEach((f) => { f.img.animate([{ translate: '0 0' }, { translate: '1.5% 0' }, { translate: '-1.5% 0' }, { translate: '0 0' }], { duration: 300 }); });
    },
});
</script>
</body>
</html>
